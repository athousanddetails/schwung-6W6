<!doctype html>
<!--
  6W6 remote panel — served by schwung-manager at /remote-ui when 6W6 is the
  slot's synth. Talks to the device through the schwungRemote postMessage
  bridge; every continuous control is a 0-127 pot, mirroring the hardware.

  Laid out after the TR-606 itself: brushed silver panels, black legend, red
  only where it means something, a row of small level knobs across the top
  and an INSTRUMENT selector. No step strip: the DSP's built-in step lanes
  are driven by Move's own step buttons through the chain patch, and a second
  editor for them here double-hits anything also programmed on Move. The
  panel FOLLOWS the device instead: hit a pad and the instrument changes here
  too (the editor publishes the page it follows as synth:ui_focus).

  GPL-3.0.
-->
<html>
<head>
<meta charset="utf-8">
<title>6W6</title>
<style>
  :root {
    --silver:  #d6d6d2;          /* brushed panel          */
    --silver2: #c4c4bf;          /* lower panel, a shade darker */
    --ink:     #111;             /* legend                 */
    --red:     #e0261c;          /* LEDs, step numbers     */
    --led-off: #5a1310;
    --strip:   #161616;          /* the sequencer strip    */
    --btn:     #cfcfca;          /* silver step button cap */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #222; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
         padding: 14px; color: var(--ink); }
  .machine { max-width: 1180px; margin: 0 auto; background: #3a3a3a;
             border: 2px solid #000; border-radius: 10px; padding: 8px; }
  .panel { background: linear-gradient(180deg, #e0e0dc 0%, var(--silver) 40%, #cfcfca 100%);
           border: 1px solid #8a8a86; border-radius: 4px; padding: 8px 12px; margin-bottom: 6px; }
  .panel.lower { background: linear-gradient(180deg, #d2d2ce, var(--silver2)); }
  .row { display: flex; align-items: flex-end; gap: 10px; }
  .brand { display: flex; align-items: baseline; justify-content: space-between; }
  .brand .logo { font-size: 30px; font-weight: 900; letter-spacing: 1px; }
  .brand .model { font-size: 26px; font-weight: 300; letter-spacing: 1px; }
  .brand .model b { font-weight: 900; }
  .legend { font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
            text-align: center; white-space: nowrap; }
  .legend.sm { font-weight: 400; letter-spacing: .8px; font-size: 8.5px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 64px; }
  .cell.wide { width: 90px; }
  .val { font-size: 9px; color: #333; height: 10px; }
  .knob { position: relative; width: 40px; height: 40px; border-radius: 50%;
          background: radial-gradient(circle at 50% 45%, #f2f2f0 0 34%, #b9b9b6 35% 48%, #1a1a1a 49% 100%);
          border: 1px solid #000; cursor: ns-resize; touch-action: none; }
  .knob.big { width: 58px; height: 58px; }
  .knob .ptr { position: absolute; left: 50%; top: 50%; width: 2px; height: 15px;
               background: #000; transform-origin: 50% 0%; }
  .knob.big .ptr { height: 22px; }
  .ticks { position: absolute; inset: -6px; border-radius: 50%;
           background: repeating-conic-gradient(from -135deg, #333 0 1deg, transparent 1deg 27deg);
           -webkit-mask: radial-gradient(circle, transparent 57%, #000 58%); mask: radial-gradient(circle, transparent 57%, #000 58%);
           pointer-events: none; }
  select { width: 66px; height: 22px; border: 1px solid #000; border-radius: 3px;
           background: #ebebe8; font-weight: 700; font-size: 10px; }
  .sep { width: 1px; align-self: stretch; background: #8a8a86; margin: 0 4px; }
  .grow { flex: 1; }
  /* instrument selector: the 606's TRACK/INSTRUMENT ring, flattened */
  .inst { display: flex; gap: 4px; }
  .inst button { font: 700 10px/1 Helvetica, Arial; letter-spacing: 1px; padding: 6px 9px;
                 border: 1px solid #000; border-radius: 3px; background: #ebebe8; cursor: pointer; }
  .inst button.on { background: #111; color: #fff; }
  .inst button .n { display: inline-block; background: #111; color: #fff; padding: 1px 3px;
                    margin-right: 4px; border-radius: 2px; font-size: 9px; }
  .inst button.on .n { background: #fff; color: #111; }
  .mute { font: 700 10px/1 Helvetica, Arial; padding: 6px 9px; border: 1px solid #000;
          border-radius: 3px; background: #ebebe8; cursor: pointer; letter-spacing: 1px; }
  .mute.on { background: var(--red); color: #fff; }
  /* the sequencer strip */
  .strip { background: var(--strip); border: 2px solid #000; border-radius: 4px;
           padding: 10px 12px 8px; color: #eee; }
  .strip .hdr { display: flex; justify-content: space-between; align-items: center;
                font-size: 9px; letter-spacing: 1.5px; margin-bottom: 8px; color: #ddd; }
  .foot { font-size: 9px; color: #bbb; text-align: right; margin-top: 6px; }
  /* --- stacked sections: everything visible, 9W9-style, 606 colours --- */
  .rack { display: flex; flex-wrap: wrap; gap: 6px; }
  /* 7 controls x 54px + gaps + padding — sized so a voice never wraps onto a
     second line, which left ragged half-empty boxes. */
  .sect { background: linear-gradient(180deg, #d2d2ce, var(--silver2));
          border: 1px solid #8a8a86; border-radius: 4px; padding: 5px 8px 6px;
          flex: 1 1 418px; min-width: 418px; }
  .sect.bus  { flex: 1 1 418px; }
  .sect.mast { background: linear-gradient(180deg, #2f2f2f, #1e1e1e); color: #eee;
               border-color: #000; flex-basis: 100%; }
  .sect.mast .legend, .sect.mast .val { color: #ddd; }
  .sect.on { box-shadow: inset 0 0 0 2px var(--red); }   /* the voice the Move is on */
  .shead { display: flex; align-items: center; justify-content: space-between;
           border-bottom: 1px solid #8a8a86; margin-bottom: 5px; padding-bottom: 2px; }
  .sect.mast .shead { border-color: #555; }
  /* the bottom bar holds three labelled groups side by side */
  .grp { display: flex; flex-direction: column; gap: 3px; }
  .gname { font: 800 9px/1 Helvetica, Arial; letter-spacing: 2px; color: var(--red);
           text-transform: uppercase; }
  .sect.mast .row { flex-wrap: wrap; gap: 4px 10px; align-items: flex-start; }
  .vsep { width: 1px; align-self: stretch; background: #555; margin: 0 2px; }
  .sname { font: 800 10px/1 Helvetica, Arial; letter-spacing: 2px; text-transform: uppercase; }
  .sect .row { flex-wrap: nowrap; gap: 2px 4px; align-items: flex-end; }
  .sect .cell { width: 54px; flex: 0 0 54px; }
  .sect .legend { white-space: nowrap; overflow: hidden; }
  .sect .knob { width: 34px; height: 34px; }
  .sect .knob .ptr { height: 13px; }
  .sect select { width: 58px; height: 20px; }
</style>
</head>
<body>
<div class="machine">

  <!-- top panel: the 606's own face — accent, a level per voice, volume -->
  <div class="panel">
    <div class="brand"><div class="logo">6W6</div><div class="model">Drumatix</div></div>
    <div class="row" id="levels" style="margin-top:6px"></div>
  </div>

  <!-- everything else, all of it, at once -->
  <div class="rack" id="rack"></div>

  <div class="strip" style="margin-top:6px">
    <div class="hdr"><span id="focus-note">&nbsp;</span>
      <span>DRAG KNOBS &middot; DOUBLE-CLICK RESETS TO THE FITTED 606</span></div>
    <div class="foot">by athousanddetails &middot; voices after 606-Inspired-Synth-Drums (MIT)</div>
  </div>
</div>

<script src="/static/schwung-remote-api.js"></script>
<script>
(function () {
  "use strict";

  /* Degrade instead of dying if the bridge script is missing (a headless
   * screenshot, or schwung-manager not serving /static): every control still
   * draws, nothing is sent anywhere. */
  if (!window.schwungRemote) {
    var noop = function () { return { then: function () {} }; };
    window.schwungRemote = { getParam: noop, setParam: function () {}, onParamChange: function () {} };
  }

  var DIST  = ["Diode", "Clip", "SAT", "BFZ", "PDIST", "Fold", "Crush"];
  var MDIST = ["Off", "Diode", "Clip", "SAT", "BFZ", "PDIST", "Fold", "Crush"];
  var CHOKE = ["Off", "CH>OH", "Mutual"];
  var DIVS  = ["1/32", "1/16T", "1/16", "1/8T", "1/16.", "1/8", "1/4T",
               "1/8.", "1/4", "1/2T", "1/4.", "1/2", "1/2."];

  function pot(k, n)      { return { k: k, n: n }; }
  function en(k, n, opts) { return { k: k, n: n, opts: opts }; }

  /*
   * EVERY control is on screen at once. There is no instrument selector and
   * no page switching, which is the point: the browser's one advantage over
   * the Move's 8-knob screen is space, and hiding seven voices behind a
   * selector threw that away. It also removes a whole class of bug -- with
   * nothing to switch, the panel and the device can never disagree about
   * which page is showing, so nothing needs to be sent to keep them in step.
   * The device's current voice is merely HIGHLIGHTED, read-only.
   *
   * Level lives in the top strip, not in the rows: that strip is the 606's
   * own face (accent, a level per voice, volume) and repeating Level here
   * would be duplication.
   */
  var VOICES = [
    { id: "bd", name: "Bass Drum",  knobs: [pot("bd_tune","Tune"), pot("bd_decay","Decay"),
                                            pot("bd_attack","Attack")] },
    { id: "sd", name: "Snare",      knobs: [pot("sd_tune","Tune"), pot("sd_snappy","Snappy"),
                                            pot("sd_tone","Tone")] },
    { id: "lt", name: "Low Tom",    knobs: [pot("lt_tune","Tune"), pot("lt_decay","Decay")] },
    { id: "ht", name: "Hi Tom",     knobs: [pot("ht_tune","Tune"), pot("ht_decay","Decay")] },
    { id: "ch", name: "Closed Hat", knobs: [pot("ch_tune","Tune"), pot("ch_decay","Decay"),
                                            en("hh_choke","Choke",CHOKE)] },
    { id: "oh", name: "Open Hat",   knobs: [pot("oh_tune","Tune"), pot("oh_decay","Decay")] },
    { id: "cy", name: "Cymbal",     knobs: [pot("cy_tune","Tune"), pot("cy_decay","Decay")] },
    { id: "cp", name: "Hand Clap",  knobs: [pot("cp_tune","Tune"), pot("cp_decay","Decay"),
                                            pot("cp_noise","Noise")] }
  ];

  var BUSES = [
    { id: "rev", name: "Reverb", knobs: [pot("rev_decay","Decay"), pot("rev_tone","Tone"),
                                         pot("rev_hpf","HPF"), pot("rev_level","Level")] },
    { id: "dly", name: "Delay",  knobs: [en("dly_time","Time",DIVS), pot("dly_fdbk","Fdbk"),
                                         pot("dly_tone","Tone"), pot("dly_hpf","HPF"),
                                         pot("dly_level","Level")] }
  ];

  var MASTER = [ en("master_dist","M.Dist",MDIST), pot("master_drive","M.Drive"),
                 pot("comp","Comp"), pot("vel_depth","Velocity"),
                 en("hh_choke","Choke",CHOKE),
                 en("note_map","Notes",["Rack 36","GM"]) ];

  var state = {}, widgets = {}, mutesMask = 0, muteBtns = {}, sectEls = {};

  function key(k) { return "synth:" + k; }
  function addWidget(k, fn) { (widgets[k] = widgets[k] || []).push(fn); }
  function send(k, v) {
    state[k] = v;
    schwungRemote.setParam(key(k), String(v));
    (widgets[k] || []).forEach(function (fn) { fn(v); });   /* keys shown twice stay in step */
  }

  function knob(parent, kn) {
    var cell = document.createElement("div"); cell.className = "cell";
    var lg = document.createElement("div"); lg.className = "legend"; lg.textContent = kn.n;
    var el = document.createElement("div"); el.className = "knob";
    var tk = document.createElement("div"); tk.className = "ticks";
    var ptr = document.createElement("div"); ptr.className = "ptr";
    el.appendChild(tk); el.appendChild(ptr);
    var val = document.createElement("div"); val.className = "val";
    function render(v) {
      ptr.style.transform = "translate(-50%,0) rotate(" + (-135 + v / 127 * 270 + 180) + "deg)";
      val.textContent = v;
    }
    addWidget(kn.k, render);
    var y0 = null, v0 = 0;
    function move(e) {
      if (y0 === null) return;
      var y = e.touches ? e.touches[0].clientY : e.clientY;
      var v = Math.max(0, Math.min(127, Math.round(v0 + (y0 - y) * 0.7)));
      if (v !== state[kn.k]) send(kn.k, v);
      e.preventDefault();
    }
    function up() { y0 = null;
      window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up);
      window.removeEventListener("touchmove", move); window.removeEventListener("touchend", up); }
    function down(e) {
      y0 = e.touches ? e.touches[0].clientY : e.clientY; v0 = state[kn.k] | 0;
      window.addEventListener("mousemove", move); window.addEventListener("mouseup", up);
      window.addEventListener("touchmove", move, { passive: false });
      window.addEventListener("touchend", up);
      e.preventDefault();
    }
    el.addEventListener("mousedown", down);
    el.addEventListener("touchstart", down, { passive: false });
    /* reset = the DSP's own fitted default, never a guessed 64: this kit's
     * defaults were fitted against hardware and most are not centred */
    el.addEventListener("dblclick", function () {
      schwungRemote.setParam(key(kn.k), "default");
      setTimeout(function () {
        schwungRemote.getParam(key(kn.k)).then(function (v) { apply(kn.k, v); });
      }, 120);
    });
    cell.appendChild(lg); cell.appendChild(el); cell.appendChild(val);
    parent.appendChild(cell); render(state[kn.k] | 0);
  }

  function sel(parent, kn) {
    var cell = document.createElement("div"); cell.className = "cell";
    var lg = document.createElement("div"); lg.className = "legend"; lg.textContent = kn.n;
    var s = document.createElement("select");
    kn.opts.forEach(function (o, i) {
      var op = document.createElement("option"); op.value = i; op.textContent = o; s.appendChild(op);
    });
    s.addEventListener("change", function () { send(kn.k, s.value | 0); });
    addWidget(kn.k, function (v) { s.value = Math.min(v, kn.opts.length - 1); });
    cell.appendChild(lg); cell.appendChild(s); parent.appendChild(cell);
    s.value = state[kn.k] | 0;
  }

  function control(parent, kn) { if (kn.opts) sel(parent, kn); else knob(parent, kn); }

  /* ---- the 606 face: accent, a level per voice, volume ---- */
  var top = document.getElementById("levels");
  /* the level strip labels the voices, so it uses short names */
  var SHORTNAME = { bd: "Bass", sd: "Snare", lt: "Lo Tom", ht: "Hi Tom",
                    ch: "Cl Hat", oh: "Op Hat", cy: "Cymbal", cp: "Clap" };
  VOICES.forEach(function (V) { knob(top, pot(V.id + "_level", SHORTNAME[V.id])); });
  var grow = document.createElement("div"); grow.className = "grow"; top.appendChild(grow);
  knob(top, pot("volume", "Volume"));

  /* ---- one section per voice, then the two buses, then master ---- */
  var rack = document.getElementById("rack");

  function section(def, cls, lane) {
    var box = document.createElement("div"); box.className = "sect" + (cls ? " " + cls : "");
    var head = document.createElement("div"); head.className = "shead";
    var nm = document.createElement("span"); nm.className = "sname"; nm.textContent = def.name;
    head.appendChild(nm);
    if (lane !== undefined) {
      var mb = document.createElement("div"); mb.className = "mute"; mb.textContent = "MUTE";
      mb.addEventListener("click", function () {
        mutesMask = (mutesMask ^ (1 << lane)) & 0xFF;
        schwungRemote.setParam(key("mutes"), String(mutesMask));
        renderMutes();
      });
      muteBtns[lane] = mb; head.appendChild(mb);
    }
    box.appendChild(head);
    var row = document.createElement("div"); row.className = "row";
    def.knobs.forEach(function (kn) { control(row, kn); });
    box.appendChild(row);
    rack.appendChild(box);
    return box;
  }

  VOICES.forEach(function (V, i) {
    /* Drive, Distortion and the two sends are on every voice, so they are
     * appended here rather than repeated in each definition above. */
    var def = { name: V.name, knobs: V.knobs.concat([
      pot(V.id + "_drive", "Drive"), en(V.id + "_dist_type", "Dist", DIST),
      pot(V.id + "_rev", "Rev"), pot(V.id + "_dly", "Dly") ]) };
    sectEls[i] = section(def, "", i);
  });
  /*
   * The two send buses live on the master bar, not in the voice grid: they
   * are bus processing, the same as the master stage, and grouping them there
   * keeps the grid above purely about drums.
   */
  (function bottomBar() {
    var box = document.createElement("div"); box.className = "sect mast";
    var head = document.createElement("div"); head.className = "shead";
    var nm = document.createElement("span"); nm.className = "sname";
    nm.textContent = "Bus"; head.appendChild(nm);
    box.appendChild(head);
    var row = document.createElement("div"); row.className = "row";
    var groups = BUSES.concat([{ id: "master", name: "Master", knobs: MASTER }]);
    groups.forEach(function (G, i) {
      if (i) { var v = document.createElement("div"); v.className = "vsep"; row.appendChild(v); }
      var grp = document.createElement("div"); grp.className = "grp";
      var gn = document.createElement("div"); gn.className = "gname"; gn.textContent = G.name;
      var inner = document.createElement("div"); inner.className = "row";
      G.knobs.forEach(function (kn) { control(inner, kn); });
      grp.appendChild(gn); grp.appendChild(inner);
      row.appendChild(grp);
    });
    box.appendChild(row);
    rack.appendChild(box);
  })();

  function renderMutes() {
    Object.keys(muteBtns).forEach(function (lane) {
      muteBtns[lane].className = "mute" + ((mutesMask >> lane) & 1 ? " on" : "");
    });
  }

  /* The device's current voice is highlighted, nothing more. Read-only: with
   * every control already on screen there is no page to switch, so the panel
   * never has to tell the device anything about what it is showing. */
  var focusNote = document.getElementById("focus-note");
  function renderFocus(n) {
    Object.keys(sectEls).forEach(function (i) {
      sectEls[i].className = "sect" + (+i === n ? " on" : "");
    });
    focusNote.textContent = VOICES[n] ? ("MOVE IS ON " + VOICES[n].name.toUpperCase()) : "\u00a0";
  }

  function apply(k, raw) {
    if (k === "ui_focus") { renderFocus(parseInt(raw, 10)); return; }
    var v = parseInt(raw, 10);
    if (isNaN(v)) return;
    if (k === "mutes") { mutesMask = v; renderMutes(); return; }
    state[k] = v;
    if (widgets[k]) widgets[k].forEach(function (fn) { fn(v); });
  }

  schwungRemote.onParamChange(function (params) {
    Object.keys(params).forEach(function (full) {
      if (full.indexOf("synth:") === 0) apply(full.substring(6), params[full]);
    });
  });

  function seed() {
    Object.keys(widgets).concat(["mutes", "ui_focus"]).forEach(function (k) {
      schwungRemote.getParam(key(k)).then(function (v) {
        if (v !== undefined && v !== null && v !== "") apply(k, v);
      });
    });
  }
  setTimeout(seed, 400);
  setTimeout(seed, 1500);
})();
</script>
</body>
</html>
